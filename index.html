<!DOCTYPE html>
<html><head><title>Hotel 18008</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:monospace;background:#111;color:#0f0}.header{background:orange;color:#000;padding:15px;font-size:20px;font-weight:bold;text-align:center}.info{background:#222;padding:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:12px}.info span{color:#0f0;font-weight:bold}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}.box{height:70px;border:2px solid #0f0;display:flex;align-items:center;justify-content:center;cursor:pointer;font-weight:bold;border-radius:6px}.free{background:#003300}.booked{background:#550000;color:red}.selected{border-color:orange;color:orange;background:#332200}#console{background:#000;border:1px solid #0f0;height:120px;overflow:auto;padding:10px;margin:10px;font-size:11px}button{background:orange;border:none;padding:8px 12px;font-weight:bold;margin:4px;border-radius:4px;cursor:pointer}.cart{background:#222;border:2px solid orange;padding:12px;margin:10px;border-radius:8px}</style></head><body>
<div class="header">SWIGGY GNU::8085 - HOTEL ROYAL MUMBAI - 18008</div>
<div class="info"><div>HL: <span id="hl">--</span></div><div>SP Count: <span id="spc">0</span></div><div>Bill: Rs <span id="bill">0</span></div><div>Z: <span id="z">0</span></div></div>
<h3 style="color:orange;padding-left:10px">Table Memory [2000H]</h3><div class="grid" id="tables"></div>
<div id="console">> LXI SP,2110H - Ready<br>> LXI H,2000H - Tables Ready<br></div>
<h3 style="color:orange;padding-left:10px">Food - PUSH</h3><div style="padding:0 10px"><button onclick="order(1,'Burger',150)">Burger Rs150</button><button onclick="order(2,'Pizza',350)">Pizza Rs350</button><button onclick="order(3,'Cola',50)">Cola Rs50</button><button onclick="order(4,'Biryani',250)">Biryani Rs250</button></div>
<div class="cart"><div>Cart: <span id="cartcount">0</span> items</div><div id="cartlist" style="color:#0f0;margin:8px 0">Empty</div><div style="font-size:18px;color:#0f0">Total: Rs <span id="total">0</span></div><br><button onclick="hlt()" style="background:#0f0;width:100%;padding:12px">PLACE ORDER - HLT</button></div>
<script>let tables=[0,1,0,0,1,0],hl=null,spc=0,bill=0,cart=[];function show(){let h='';tables.forEach((v,i)=>{let c=v==1?'booked':'free';if(hl==i)c='selected';let t=v==1?'BOOKED':'FREE';h+=`<div class="box ${c}" onclick="book(${i})">T0${i+1}<br>${t}</div>`;});document.getElementById('tables').innerHTML=h;document.getElementById('hl').innerText=hl!=null?'T0'+(hl+1):'--';document.getElementById('spc').innerText=spc;document.getElementById('bill').innerText=bill;document.getElementById('total').innerText=bill;document.getElementById('cartcount').innerText=spc;document.getElementById('z').innerText=hl!=null?'1':'0';document.getElementById('cartlist').innerHTML=cart.length?cart.join('<br>'):'Empty';}function log(m){document.getElementById('console').innerHTML+='> '+m+'<br>';}function book(id){if(tables[id]==1){log('CALL T0'+(id+1)+' FAIL Already BOOKED');return;}tables[id]=1;hl=id;log('CALL T0'+(id+1)+' SUCCESS Z=1');show();}function order(c,n,p){if(hl==null){alert('Pehle Table Book Karo!');return;}cart.push('PUSH '+n+' Rs'+p);spc++;bill+=p;log('PUSH '+n+' Bill='+bill);show();}function hlt(){if(spc==0){alert('Cart khali');return;}log('HLT Order Placed Bill Rs'+bill);alert('ORDER PLACED Table T0'+(hl+1)+' Bill Rs'+bill);}show();</script></body></html>
